name: Import rugby metadata to MongoDB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib
          for path in [pathlib.Path("import_rugby"), pathlib.Path("import_pwr_history"), pathlib.Path("index_releases"), pathlib.Path("match_releases"), *pathlib.Path("indexers").glob("*"), *pathlib.Path("matchers").glob("*.py"), *pathlib.Path("calendar_legacy").glob("*.py")]:
              compile(path.read_text(), str(path), "exec")
          PY
      - name: Test rugby adapters
        env:
          PYTHONPATH: calendar_legacy
        run: python -m unittest discover -s calendar_legacy -p 'test_*.py'
      - name: Test release indexers and importer
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise rugby import against published spoiler-free snapshots
        run: python import_rugby --dry-run --no-refresh
  import:
    # Manual until Atlas secret and network access are configured.
    if: github.event_name == 'workflow_dispatch'
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Import fixtures into Atlas
        env:
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
          MONGODB_DATABASE: pvr
          PREM_APP_ID: ${{ secrets.PREM_APP_ID }}
          PREM_API_KEY: ${{ secrets.PREM_API_KEY }}
          PREM_REALM: ${{ secrets.PREM_REALM }}
        run: python import_rugby
