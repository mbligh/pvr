name: PVR tests
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Compile Python sources
        run: |
          python - <<'PY'
          import pathlib
          for path in [pathlib.Path("import_rugby"), pathlib.Path("import_rugby_lineups"), pathlib.Path("import_pwr_lineups"), pathlib.Path("import_prem_lineups"), pathlib.Path("import_pwr_history"), pathlib.Path("index_releases"), pathlib.Path("match_releases"), pathlib.Path("match_rugbypass"), pathlib.Path("match_prem"), pathlib.Path("inventory_files"), pathlib.Path("download_release"), pathlib.Path("file_recording"), pathlib.Path("select_recording"), pathlib.Path("refresh_releases"), pathlib.Path("f1_data"), pathlib.Path("import_f1"), pathlib.Path("import_teletz"), pathlib.Path("reddit_teletz.py"), pathlib.Path("select_f1_releases"), pathlib.Path("transfernow"), pathlib.Path("acquire_rugby"), pathlib.Path("run_rugby"), pathlib.Path("acquire_f1"), pathlib.Path("run_f1"), *pathlib.Path("downloaders").glob("*.py"), *pathlib.Path("filing").glob("*.py"), *pathlib.Path("selection").glob("*.py"), *pathlib.Path("orchestration").glob("*.py"), *pathlib.Path("inventory").glob("*.py"), *pathlib.Path("indexers").glob("*"), *pathlib.Path("matchers").glob("*.py"), *pathlib.Path("schedulers").rglob("*.py")]:
              compile(path.read_text(), str(path), "exec")
          PY
      - name: Run PVR unit tests
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Exercise rugby import against published spoiler-free snapshots
        run: python import_rugby --offline --no-refresh
